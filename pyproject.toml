[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "togeari"
# maturin reads the version from Cargo.toml.
dynamic = ["version"]
description = "Togeari: a dataflow machine that runs many KIR jobs at once, out of order, on pluggable engines"
authors = [
    { name = "Shih-Ying Yeh(KohakuBlueLeaf)", email = "apolloyeh0123@gmail.com" },
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["kohakunode>=0.3.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://kblueleaf.net/"
Repository = "https://github.com/KohakuBlueleaf/Togeari"

[project.optional-dependencies]
torch = ["torch>=2.4"]
web = ["httpx>=0.27", "sniffio"]
vault = ["kohakuvault>=1.0"]
telemetry = ["kohakuvault>=1.0", "numpy>=1.24"]
report = ["zstandard>=0.22"]
dev = [
    "maturin>=1.9,<2.0",
    "pytest>=8",
    "pytest-xdist>=3.6",
    "ruff",
    "black",
    "httpx>=0.27",
    "sniffio",
    "zstandard>=0.22",
]

[project.scripts]
togeari = "togeari.cli.main:main"

[tool.maturin]
# Python source is in src/togeari; the crate is src/togeari-rust (Cargo.toml)
python-source = "src"
module-name = "togeari._rs"
include = ["src/togeari/**/*.pyi", "src/togeari/py.typed"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE", "UP", "SIM", "PERF", "RUF100", "PLC0415"]
ignore = ["B905", "PERF203"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# Shared test helpers (rt_helpers, plugin_programs) sit above their tests' subfolders
pythonpath = ["tests/runtime", "tests/plugins"]
markers = [
    "gpu: needs a CUDA device (cuda:0); `-m \"not gpu\"` runs the CPU-only suite",
    "serial: asserts a wall-clock bound or a scheduling outcome; runs in its own pass without pytest-xdist (`-m serial`), never beside other workers",
    "timeout(seconds): the watchdog bound of one test (default TOGEARI_TEST_TIMEOUT, 900 s); past it the stacks go to runs/tests/watchdog.txt and the session exits",
]
