<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='470' viewBox='0 0 1200 470' font-family='ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial' font-size='13'>
<defs>
  <marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'>
    <path d='M0,0 L10,5 L0,10 z' fill='#8b949e'/>
  </marker>
</defs>

<!-- Jobs: many plain sequential programs -->
<text x='20' y='28' fill='#8b949e' font-size='15' font-weight='600'>thousands of jobs</text>
<text x='20' y='46' fill='#8b949e'>each a plain sequential KIR program</text>
<rect x='44' y='76' width='250' height='196' rx='8' fill='#8b949e14' stroke='#8b949e66'/>
<rect x='32' y='68' width='250' height='196' rx='8' fill='#8b949e14' stroke='#8b949e66'/>
<rect x='20' y='60' width='250' height='196' rx='8' fill='#8b949e1f' stroke='#8b949e'/>
<g font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size='12' fill='#8b949e'>
  <text x='32' y='84'>@def (city)report(summary):</text>
  <text x='44' y='104'>(city)weather(w)</text>
  <text x='44' y='122'>(city)events(n)</text>
  <text x='44' y='140'>(w)is_stormy(storm)</text>
  <text x='44' y='158'>(storm)branch(`a`, `b`)</text>
  <text x='44' y='176'>(districts)each(d, `s`)</text>
  <text x='56' y='194'>(d)survey(score)</text>
  <text x='44' y='212'>...</text>
  <text x='44' y='230'>(w, n, ...)compose(summary)</text>
</g>

<!-- Arrow: jobs into the machine -->
<line x1='300' y1='160' x2='344' y2='160' stroke='#8b949e' stroke-width='2' marker-end='url(#arrow)'/>

<!-- The machine -->
<rect x='350' y='60' width='450' height='300' rx='12' fill='#2f81f714' stroke='#2f81f7' stroke-width='1.5'/>
<text x='366' y='86' fill='#2f81f7' font-size='15' font-weight='600'>Togeari machine</text>
<text x='516' y='86' fill='#8b949e'>one dispatcher, out of order, like a CPU core</text>

<!-- Front end: strands fetch ahead -->
<text x='366' y='114' fill='#8b949e'>strands fetch ahead</text>
<line x1='366' y1='126' x2='560' y2='126' stroke='#2f81f7' stroke-width='3'/>
<line x1='420' y1='126' x2='470' y2='146' stroke='#a371f7' stroke-width='3'/>
<line x1='470' y1='146' x2='560' y2='146' stroke='#a371f7' stroke-width='3'/>
<line x1='440' y1='126' x2='480' y2='162' stroke='#3fb950' stroke-width='3'/>
<line x1='480' y1='162' x2='560' y2='162' stroke='#3fb950' stroke-width='3'/>
<text x='570' y='130' fill='#8b949e'>main</text>
<text x='570' y='150' fill='#8b949e'>past a pending branch</text>
<text x='570' y='166' fill='#8b949e'>one strand per each item</text>

<!-- Window: statements in flight, retired in order -->
<text x='366' y='198' fill='#8b949e'>window of renamed statements</text>
<g>
  <rect x='366' y='208' width='30' height='22' rx='3' fill='#3fb950'/>
  <rect x='400' y='208' width='30' height='22' rx='3' fill='#2f81f7'/>
  <rect x='434' y='208' width='30' height='22' rx='3' fill='#3fb950'/>
  <rect x='468' y='208' width='30' height='22' rx='3' fill='#2f81f7'/>
  <rect x='502' y='208' width='30' height='22' rx='3' fill='#8b949e55'/>
  <rect x='536' y='208' width='30' height='22' rx='3' fill='#2f81f7'/>
  <rect x='570' y='208' width='30' height='22' rx='3' fill='#3fb950'/>
  <rect x='604' y='208' width='30' height='22' rx='3' fill='#8b949e55'/>
</g>
<rect x='648' y='211' width='12' height='12' rx='2' fill='#3fb950'/><text x='664' y='222' fill='#8b949e'>done</text>
<rect x='704' y='211' width='12' height='12' rx='2' fill='#2f81f7'/><text x='720' y='222' fill='#8b949e'>issued</text>
<line x1='366' y1='246' x2='634' y2='246' stroke='#8b949e' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='366' y='262' fill='#8b949e'>retired in program order; faults precise; @try exact</text>

<!-- Lanes -->
<text x='366' y='292' fill='#8b949e'>lanes: queue, batch, pick a unit, multi-issue</text>
<g>
  <rect x='366' y='302' width='120' height='40' rx='6' fill='#d2992214' stroke='#d29922'/>
  <text x='378' y='326' fill='#d29922'>batch lane</text>
  <rect x='496' y='302' width='120' height='40' rx='6' fill='#d2992214' stroke='#d29922'/>
  <text x='508' y='326' fill='#d29922'>call lane</text>
  <rect x='626' y='302' width='120' height='40' rx='6' fill='#d2992214' stroke='#d29922'/>
  <text x='638' y='326' fill='#d29922'>stream lane</text>
</g>

<!-- Arrows: lanes to engines and results back -->
<line x1='806' y1='150' x2='850' y2='150' stroke='#8b949e' stroke-width='2' marker-end='url(#arrow)'/>
<line x1='850' y1='250' x2='806' y2='250' stroke='#8b949e' stroke-width='2' marker-end='url(#arrow)'/>
<text x='812' y='140' fill='#8b949e' font-size='11'>submit</text>
<text x='812' y='268' fill='#8b949e' font-size='11'>results</text>

<!-- Engines -->
<text x='860' y='28' fill='#8b949e' font-size='15' font-weight='600'>pluggable engines</text>
<text x='860' y='46' fill='#8b949e'>checked against one contract (B1–B7)</text>
<g>
  <rect x='860' y='60' width='320' height='84' rx='8' fill='#a371f714' stroke='#a371f7'/>
  <text x='874' y='84' fill='#a371f7' font-weight='600'>TorchEngine</text>
  <text x='874' y='104' fill='#8b949e'>models sharing a GPU, batched across jobs</text>
  <rect x='874' y='114' width='22' height='18' rx='3' fill='#a371f7'/><rect x='900' y='114' width='22' height='18' rx='3' fill='#a371f7'/><rect x='926' y='114' width='22' height='18' rx='3' fill='#a371f7'/><rect x='952' y='114' width='22' height='18' rx='3' fill='#a371f7'/>
  <text x='984' y='128' fill='#8b949e'>one batch, many jobs</text>

  <rect x='860' y='158' width='320' height='84' rx='8' fill='#a371f714' stroke='#a371f7'/>
  <text x='874' y='182' fill='#a371f7' font-weight='600'>WebCallEngine</text>
  <text x='874' y='202' fill='#8b949e'>any HTTP service: rate limits, Retry-After</text>
  <text x='874' y='222' fill='#8b949e'>unit errors block the unit, items retry</text>

  <rect x='860' y='256' width='320' height='84' rx='8' fill='#a371f714' stroke='#a371f7'/>
  <text x='874' y='280' fill='#a371f7' font-weight='600'>PythonCallEngine · your engine</text>
  <text x='874' y='300' fill='#8b949e'>threads or processes, shared memory</text>
  <text x='874' y='320' fill='#8b949e'>or anything that keeps the contract</text>
</g>

<!-- Sink and proof -->
<line x1='575' y1='360' x2='575' y2='384' stroke='#8b949e' stroke-width='2' marker-end='url(#arrow)'/>
<rect x='430' y='388' width='290' height='34' rx='8' fill='#3fb95014' stroke='#3fb950'/>
<text x='446' y='410' fill='#3fb950'>records → sink → togeari conform</text>
<text x='730' y='410' fill='#8b949e'>replayed through the kohakunode reference: 120/120</text>

<!-- Timeline strip -->
<text x='20' y='326' fill='#8b949e' font-size='15' font-weight='600'>one job</text>
<text x='20' y='350' fill='#8b949e'>calls one after another</text>
<rect x='20' y='358' width='280' height='14' rx='3' fill='#d29922'/>
<text x='20' y='396' fill='#8b949e'>on Togeari</text>
<rect x='20' y='404' width='70' height='14' rx='3' fill='#2f81f7'/>
<rect x='20' y='422' width='56' height='14' rx='3' fill='#2f81f7'/>
<rect x='20' y='440' width='26' height='14' rx='3' fill='#2f81f7'/>
<rect x='70' y='440' width='20' height='14' rx='3' fill='#a371f7'/>
<text x='110' y='432' fill='#8b949e'>1.40 s → 0.45 s</text>
</svg>
