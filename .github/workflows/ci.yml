name: CI

on:
  push:
    branches: [main]
  pull_request:

# Update this immutable revision when validating a new compatible KIR pair.
# Development CI builds it directly; releases still publish KIR before Togeari.
env:
  KIR_REVISION: 'a9b2a647379bf217cebf8e9a42375bc262fbd9df'

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check out the paired KIR revision
        uses: actions/checkout@v4
        with:
          repository: KohakuBlueleaf/KohakuNodeIR
          ref: ${{ env.KIR_REVISION }}
          path: paired-kir
      - name: Build and install the paired KIR wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip maturin
          git -C paired-kir rev-parse HEAD
          (cd paired-kir && maturin build --release --out ../paired-wheels)
          python -m pip install paired-wheels/*.whl
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist
      - name: Install the built wheel
        shell: bash
        run: |
          WHEEL=$(ls dist/*.whl)
          python -m pip install "${WHEEL}[dev,web,vault]"
      - name: Verify the installed pair and native extensions
        run: python scripts/check_installed_pair.py --kir-revision ${{ env.KIR_REVISION }}
      # Parallel passes, then the serial tests (wall-clock bounds) alone on the runner
      - name: Tests (the default core, Rust)
        run: python -m pytest tests -q -m "not gpu and not serial" -n auto --maxprocesses 16 --dist worksteal
      - name: Tests (the Python core)
        env:
          TOGEARI_CORE: python
        run: python -m pytest tests -q -m "not gpu and not serial" -n auto --maxprocesses 16 --dist worksteal
      - name: Serial tests (the default core, Rust)
        run: python -m pytest tests -q -m "serial and not gpu"
      - name: Serial tests (the Python core)
        env:
          TOGEARI_CORE: python
        run: python -m pytest tests -q -m "serial and not gpu"
      - name: Examples
        run: |
          python examples/hello/machine.py
          python examples/multi_unit/machine.py
          python examples/trace_replay/machine.py
          python examples/parallel/machine.py

  rust:
    name: Rust (fmt, clippy, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      # Without extension-module the test binary links libpython and runs on its own
      - name: cargo test
        run: cargo test --no-default-features

  lint:
    name: Lint and boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: pip install black ruff
      - name: black
        run: python -m black --check --line-length 100 src tests examples scripts
      - name: ruff
        run: python -m ruff check src tests examples scripts
      - name: Import boundary
        run: python scripts/check_imports.py
      - name: Markdown code blocks
        run: python scripts/check_md_black.py .
