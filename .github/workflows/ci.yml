name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web,vault]"
      - name: Tests
        run: python -m pytest tests -q -m "not gpu"
      - name: Examples
        run: |
          python examples/hello/machine.py
          python examples/multi_unit/machine.py
          python examples/trace_replay/machine.py
          python examples/parallel/machine.py

  lint:
    name: Lint and boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: pip install -e ".[dev]"
      - name: black
        run: python -m black --check --line-length 100 src tests examples scripts
      - name: ruff
        run: python -m ruff check src tests examples scripts
      - name: Import boundary
        run: python scripts/check_imports.py
      - name: Markdown code blocks
        run: python scripts/check_md_black.py .
