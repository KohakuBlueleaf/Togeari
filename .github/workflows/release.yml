name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The dashboard app, built once; every wheel and the sdist carry it (src/togeari/dash/static)
  build-app:
    name: Build the dashboard app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dashboard
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-app
          path: src/togeari/dash/static/
          retention-days: 7

  build-wheels:
    name: Build cp${{ matrix.python-version }} for ${{ matrix.platform.target }}
    needs: build-app
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: '2_28'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: ''
          - os: macos-14
            target: aarch64-apple-darwin
            manylinux: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-app
          path: src/togeari/dash/static
      - name: The dashboard app is in place
        shell: bash
        run: test -f src/togeari/dash/static/index.html

      # In the manylinux container the interpreter is named; elsewhere it is the one set up
      - name: Build the wheel (Linux)
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.12.6
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --interpreter python${{ matrix.python-version }} --out dist
      - name: Build the wheel (Windows, macOS)
        if: runner.os != 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.12.6
          target: ${{ matrix.platform.target }}
          args: --release --interpreter python --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.target }}-py${{ matrix.python-version }}
          path: dist/
          retention-days: 7

  build-sdist:
    name: Build the sdist
    needs: build-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-app
          path: src/togeari/dash/static
      - name: Build
        run: |
          test -f src/togeari/dash/static/index.html
          pip install maturin
          maturin sdist --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/togeari
    permissions:
      contents: write
      id-token: write
    steps:
      # The wheels and the sdist only (not the dashboard app they carry)
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 'wheels-*'
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          name: sdist
      - name: List artifacts
        run: ls -lh dist/
      - name: Upload to the GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          fail_on_unmatched_files: false
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
