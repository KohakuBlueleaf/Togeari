<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='660' viewBox='0 0 1600 660' font-family='ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial' font-size='12'>
<defs>
  <marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'>
    <path d='M0,0 L10,5 L0,10 z' fill='#8b949e'/>
  </marker>
  <style>
    .ink { fill: #8b949e; }
    .ttl { font-size: 15px; font-weight: 600; }
    .lbl { font-size: 13px; font-weight: 600; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11.5px; }
    .box { fill: #8b949e14; stroke: #8b949e; }
    .sub { fill: #8b949e10; stroke: #8b949e88; }
    .wire { stroke: #8b949e; stroke-width: 1.6; fill: none; }
    .edge { stroke: #8b949e; stroke-width: 1.2; fill: none; }
    .ctl { stroke: #2f81f7; stroke-width: 1.4; fill: none; }
    .bus { stroke: #8b949e; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
    .core { fill: #2f81f714; stroke: #2f81f7; stroke-width: 1.5; }
    .stream { fill: #a371f714; stroke: #a371f7; }
    .batch { fill: #d2992214; stroke: #d29922; }
    .call { fill: #3fb95014; stroke: #3fb950; }
    .node { fill: #8b949e1f; stroke: #8b949e; }
  </style>
</defs>

<!-- Input: one program, as KIR text and as a node graph -->
<text x='20' y='28' class='ink ttl'>one program</text>
<text x='20' y='46' class='ink'>written sequentially, as KIR text or a node graph</text>
<rect x='20' y='58' width='330' height='300' rx='8' class='box'/>
<g class='ink mono'>
  <text x='32' y='80'>@def (city, districts)report(summary):</text>
  <text x='46' y='96'>()parallel(`a`, `b`)</text>
  <text x='46' y='112'>a:</text>
  <text x='60' y='128'>(city)weather(sky)</text>
  <text x='46' y='144'>b:</text>
  <text x='60' y='160'>(city)events(n)</text>
  <text x='46' y='176'>(city)traffic(jam)</text>
  <text x='46' y='192'>(sky)is_stormy(storm)</text>
  <text x='46' y='208'>(storm)branch(`warn`, `calm`)</text>
  <text x='46' y='224'>warn:</text>
  <text x='60' y='240'>(city)alert(note)</text>
  <text x='46' y='256'>calm:</text>
  <text x='60' y='272'>note = "clear"</text>
  <text x='46' y='288'>(districts)each(d, `one`)</text>
  <text x='46' y='304'>one:</text>
  <text x='60' y='320'>(city, d)survey(score)</text>
  <text x='60' y='336'>(scores, score)append(scores)</text>
  <text x='46' y='352'>(sky, n, jam, note, scores)compose(summary)</text>
</g>

<rect x='20' y='372' width='330' height='232' rx='8' class='box'/>
<g class='edge'>
  <path d='M65,414 V440'/>
  <path d='M65,462 V486'/>
  <path d='M104,500 H114'/>
  <path d='M293,414 V440'/>
  <path d='M293,462 V488'/>
  <path d='M144,510 C144,530 168,536 176,548'/>
  <path d='M168,414 C176,470 186,520 188,548'/>
  <path d='M217,414 C214,470 204,520 200,548'/>
  <path d='M293,510 C293,540 250,548 234,556'/>
</g>
<g class='ink mono'>
  <rect x='30' y='392' width='70' height='22' rx='4' class='node'/><text x='38' y='407'>weather</text>
  <rect x='106' y='392' width='70' height='22' rx='4' class='node'/><text x='116' y='407'>events</text>
  <rect x='182' y='392' width='70' height='22' rx='4' class='node'/><text x='189' y='407'>traffic</text>
  <rect x='258' y='392' width='70' height='22' rx='4' class='node'/><text x='279' y='407'>each</text>
  <rect x='30' y='440' width='70' height='22' rx='4' class='node'/><text x='34' y='455'>is_stormy</text>
  <rect x='258' y='440' width='70' height='22' rx='4' class='node'/><text x='272' y='455'>survey</text>
  <path d='M65,486 L104,500 L65,514 L26,500 z' class='node'/><text x='44' y='504'>branch</text>
  <rect x='114' y='489' width='60' height='22' rx='4' class='node'/><text x='127' y='504'>alert</text>
  <rect x='258' y='488' width='70' height='22' rx='4' class='node'/><text x='272' y='503'>append</text>
  <rect x='150' y='548' width='84' height='22' rx='4' class='node'/><text x='167' y='563'>compose</text>
</g>
<text x='32' y='596' class='ink'>the same program in a node editor (kohakunode)</text>

<!-- Program to code memory -->
<path d='M350,100 H378' class='wire' marker-end='url(#arrow)'/>
<path d='M350,488 H364 V112 H378' class='wire'/>

<!-- Code memory, source, admission, job pool, sink -->
<text x='380' y='28' class='ink ttl'>many jobs</text>
<text x='380' y='46' class='ink'>each a thread of the program</text>
<rect x='380' y='58' width='190' height='78' rx='8' class='box'/>
<text x='392' y='80' class='ink lbl'>Code memory</text>
<text x='392' y='98' class='ink'>decoded once, shared;</text>
<text x='392' y='114' class='ink'>a job holds only addresses</text>
<text x='392' y='130' class='ink'>several programs at once</text>

<rect x='380' y='150' width='190' height='62' rx='8' class='box'/>
<text x='392' y='172' class='ink lbl'>Source</text>
<text x='392' y='190' class='ink mono'>{city: Kyoto, …}</text>
<text x='392' y='206' class='ink mono'>{city: Lisbon, …} …</text>
<path d='M475,212 V228' class='wire' marker-end='url(#arrow)'/>

<rect x='380' y='230' width='190' height='62' rx='8' class='box'/>
<text x='392' y='252' class='ink lbl'>Admission</text>
<text x='392' y='270' class='ink'>pool size and bytes,</text>
<text x='392' y='286' class='ink'>lane and engine load</text>
<path d='M475,292 V308' class='wire' marker-end='url(#arrow)'/>

<rect x='380' y='310' width='190' height='232' rx='8' class='box'/>
<text x='392' y='332' class='ink lbl'>Job pool</text>
<rect x='392' y='342' width='166' height='58' rx='5' class='sub'/>
<text x='402' y='360' class='ink'>job Kyoto</text>
<text x='402' y='376' class='ink'>strands 3 · slots 41</text>
<text x='402' y='392' class='ink'>window 9 in flight</text>
<rect x='392' y='408' width='166' height='58' rx='5' class='sub'/>
<text x='402' y='426' class='ink'>job Lisbon</text>
<text x='402' y='442' class='ink'>strands 1 · slots 12</text>
<text x='402' y='458' class='ink'>window 2 in flight</text>
<rect x='392' y='474' width='166' height='38' rx='5' class='sub'/>
<text x='402' y='497' class='ink'>job Quito …</text>
<text x='392' y='532' class='ink'>every job is plain data</text>

<rect x='380' y='560' width='190' height='72' rx='8' class='call'/>
<text x='392' y='582' fill='#3fb950' class='lbl'>Sink</text>
<text x='392' y='600' class='ink'>one record per job;</text>
<text x='392' y='616' class='ink'>togeari conform replays it</text>

<path d='M570,426 H598' class='wire' marker-start='url(#arrow)' marker-end='url(#arrow)'/>

<!-- Dispatcher -->
<text x='600' y='28' fill='#2f81f7' class='ttl'>Dispatcher</text>
<text x='690' y='28' class='ink'>one thread, out of order, like a CPU core</text>
<rect x='600' y='40' width='410' height='560' rx='12' class='core'/>

<rect x='614' y='54' width='382' height='58' rx='6' class='sub'/>
<text x='626' y='74' class='ink lbl'>Fetch, per strand</text>
<text x='626' y='92' class='ink'>next statement from each strand's pc;</text>
<text x='626' y='106' class='ink'>parallel arms, each items, code past a pending branch</text>
<g>
  <path d='M900,66 H986' stroke='#2f81f7' stroke-width='3'/>
  <path d='M912,66 L928,78 H986' stroke='#a371f7' stroke-width='3' fill='none'/>
  <path d='M922,66 L938,90 H986' stroke='#3fb950' stroke-width='3' fill='none'/>
</g>

<rect x='614' y='122' width='382' height='50' rx='6' class='sub'/>
<text x='626' y='142' class='ink lbl'>Rename</text>
<text x='626' y='160' class='ink'>each read → the slot of the last write; each write → a fresh slot</text>

<rect x='614' y='182' width='382' height='158' rx='6' class='sub'/>
<text x='626' y='202' class='ink lbl'>Window (per job)</text>
<g class='ink mono'>
  <rect x='626' y='212' width='358' height='20' rx='3' fill='#3fb95022'/>
  <text x='634' y='226'>weather</text><text x='700' y='226'>city → sky#1</text><text x='862' y='226'>done</text>
  <rect x='626' y='236' width='358' height='20' rx='3' fill='#2f81f722'/>
  <text x='634' y='250'>traffic</text><text x='700' y='250'>city → jam#3</text><text x='862' y='250'>issued</text>
  <rect x='626' y='260' width='358' height='20' rx='3' fill='#2f81f722'/>
  <text x='634' y='274'>survey</text><text x='700' y='274'>city, d#7 → score#8</text><text x='862' y='274'>issued</text>
  <rect x='626' y='284' width='358' height='20' rx='3' fill='#8b949e18'/>
  <text x='634' y='298'>append</text><text x='700' y='298'>scores#6, score#8</text><text x='862' y='298'>waits score#8</text>
  <rect x='626' y='308' width='358' height='20' rx='3' fill='#8b949e18'/>
  <text x='634' y='322'>compose</text><text x='700' y='322'>sky#1, n#2, jam#3 …</text><text x='862' y='322'>waits note</text>
</g>

<rect x='614' y='350' width='382' height='50' rx='6' class='sub'/>
<text x='626' y='370' class='ink lbl'>Ready set + issue policy</text>
<text x='626' y='388' class='ink'>across all jobs: oldest first, deepest first, lane-aware, @hint</text>

<rect x='614' y='410' width='382' height='50' rx='6' class='sub'/>
<text x='626' y='430' class='ink lbl'>Writeback</text>
<text x='626' y='448' class='ink'>fill the slot, wake its readers, resolve pending branches</text>

<rect x='614' y='470' width='382' height='66' rx='6' class='sub'/>
<text x='626' y='490' class='ink lbl'>Retire, in program order per job</text>
<text x='626' y='508' class='ink'>ordered / mutates effects, precise faults, @try squash;</text>
<text x='626' y='524' class='ink'>job done → record → sink</text>
<path d='M614,524 H586 V596 H572' class='wire' marker-end='url(#arrow)'/>

<text x='614' y='558' class='ink'>a statement issues once its inputs are filled, in any order;</text>
<text x='614' y='574' class='ink'>its results still retire in program order</text>

<!-- Lanes -->
<text x='1040' y='28' class='ink ttl'>lanes</text>
<text x='1090' y='28' class='ink'>queue, batch, pick a unit</text>

<rect x='1040' y='54' width='540' height='50' rx='8' class='box'/>
<text x='1052' y='74' class='ink lbl'>INLINE · on the dispatcher</text>
<text x='1052' y='92' class='ink'>kir.std and μs nodes (is_stormy, compose) run during issue; no handoff</text>
<path d='M996,375 C1022,375 1018,79 1038,79' class='wire' stroke-dasharray='4 3'/>

<path d='M996,375 H1016' class='wire'/>
<path d='M1016,375 V176 H1038' class='wire' marker-end='url(#arrow)'/>
<path d='M1016,300 H1038' class='wire' marker-end='url(#arrow)'/>
<path d='M1016,375 V430 H1038' class='wire' marker-end='url(#arrow)'/>

<text x='1042' y='136' class='ink'>STREAM LANE · paces only</text>
<path d='M1042,176 H1228' class='wire' marker-end='url(#arrow)'/>
<rect x='1062' y='166' width='12' height='20' rx='2' fill='#a371f7'/>
<rect x='1078' y='166' width='12' height='20' rx='2' fill='#a371f7'/>

<text x='1042' y='256' class='ink'>BATCH LANE</text>
<rect x='1046' y='284' width='12' height='32' rx='2' fill='#d29922'/>
<rect x='1061' y='284' width='12' height='32' rx='2' fill='#d29922'/>
<rect x='1076' y='284' width='12' height='32' rx='2' fill='#d29922'/>
<rect x='1091' y='284' width='12' height='32' rx='2' fill='#8b949e55'/>
<path d='M1106,300 H1118' class='wire' marker-end='url(#arrow)'/>
<rect x='1120' y='276' width='90' height='48' rx='5' class='sub'/>
<text x='1130' y='296' class='ink lbl'>former</text>
<text x='1130' y='312' class='ink'>size · wait · key</text>
<path d='M1210,300 H1228' class='wire' marker-end='url(#arrow)'/>

<text x='1042' y='392' class='ink'>CALL LANE</text>
<rect x='1046' y='414' width='12' height='32' rx='2' fill='#3fb950'/>
<rect x='1061' y='414' width='12' height='32' rx='2' fill='#8b949e55'/>
<rect x='1076' y='414' width='12' height='32' rx='2' fill='#8b949e55'/>
<path d='M1091,430 H1118' class='wire' marker-end='url(#arrow)'/>
<rect x='1120' y='406' width='90' height='48' rx='5' class='sub'/>
<text x='1130' y='426' class='ink lbl'>select</text>
<text x='1130' y='442' class='ink'>a unit per item</text>
<path d='M1210,430 H1228' class='wire' marker-end='url(#arrow)'/>

<!-- Engines -->
<rect x='1230' y='126' width='350' height='100' rx='8' class='stream'/>
<text x='1244' y='150' fill='#a371f7' class='ttl'>Stream engine</text>
<text x='1244' y='170' class='ink'>owns its queue and batches by itself;</text>
<text x='1244' y='186' class='ink'>its load() feeds admission</text>
<text x='1244' y='210' class='ink mono'>submit(item) … results as they finish</text>

<rect x='1230' y='246' width='350' height='108' rx='8' class='batch'/>
<text x='1244' y='270' fill='#d29922' class='ttl'>Batch engine</text>
<text x='1360' y='270' class='ink'>TorchEngine</text>
<text x='1244' y='290' class='ink'>models sharing one GPU; one batch mixes jobs</text>
<g>
  <rect x='1244' y='300' width='22' height='16' rx='3' fill='#d29922'/>
  <rect x='1270' y='300' width='22' height='16' rx='3' fill='#d29922'/>
  <rect x='1296' y='300' width='22' height='16' rx='3' fill='#d29922'/>
  <rect x='1322' y='300' width='22' height='16' rx='3' fill='#d29922'/>
  <text x='1354' y='313' class='ink'>Kyoto · Lisbon · Quito · Kyoto</text>
</g>
<text x='1244' y='340' class='ink mono'>submit([items]) → [results]</text>

<rect x='1230' y='374' width='350' height='108' rx='8' class='call'/>
<text x='1244' y='398' fill='#3fb950' class='ttl'>Call engine</text>
<text x='1344' y='398' class='ink'>PythonCallEngine · WebCallEngine</text>
<text x='1244' y='418' class='ink'>threads, processes, shared memory;</text>
<text x='1244' y='434' class='ink'>any HTTP service: rate limits, Retry-After</text>
<text x='1244' y='468' class='ink mono'>submit(item) → result</text>

<rect x='1230' y='496' width='350' height='56' rx='8' class='box' stroke-dasharray='5 4'/>
<text x='1244' y='518' class='ink lbl'>your engine</text>
<text x='1244' y='538' class='ink'>a plugin, checked against one contract (B1–B7)</text>

<!-- Completion bus back to writeback -->
<path d='M1580,176 H1590 M1580,300 H1590 M1580,428 H1590 M1590,176 V600 H1028 V446' class='bus'/>
<path d='M1028,446 H998' class='bus' marker-end='url(#arrow)'/>
<text x='1040' y='588' class='ink'>completions from every engine → the dispatcher's inbox → writeback</text>
</svg>
